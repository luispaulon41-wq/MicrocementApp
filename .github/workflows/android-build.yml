name: Build debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    env:
      JAVA_VERSION: '17'
      ANDROID_API: '33'           # Android 14
      ANDROID_BUILD_TOOLS: '33.0.2'
      MODULE_PATH: 'app'          # ajuste se o módulo do seu projecto tiver outro nome
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*','**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install Android SDK and commandline tools
        run: |
          set -eux
          ANDROID_SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          cd /tmp
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip -d cmdline-tools-temp
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          mv cmdline-tools-temp/cmdline-tools/* "$ANDROID_SDK_ROOT/cmdline-tools/latest/"
          rm -rf cmdline-tools.zip cmdline-tools-temp
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --licenses || true
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" "platform-tools" "platforms;android-${{ env.ANDROID_API }}" "build-tools;${{ env.ANDROID_BUILD_TOOLS }}"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "PATH=$ANDROID_SDK_ROOT/platform-tools:$PATH" >> $GITHUB_ENV

      - name: Install Gradle (if gradlew not present)
        run: |
          set -eux
          if [ ! -f ./gradlew ]; then
            sudo apt-get update
            sudo apt-get install -y unzip curl
            curl -s "https://get.sdkman.io" | bash
            source "$HOME/.sdkman/bin/sdkman-init.sh"
            sdk install gradle 8.4.1 || true
            echo "Gradle installed"
          else
            echo "Gradle wrapper found, will use ./gradlew"
          fi

      - name: Grant execute permission for gradlew (if exists)
        run: |
          if [ -f ./gradlew ]; then chmod +x ./gradlew || true; fi

      - name: Clean (use gradlew if present, else gradle)
        run: |
          if [ -f ./gradlew ]; then ./gradlew clean --no-daemon; else gradle clean --no-daemon; fi

      - name: Assemble debug APK (use gradlew if present, else gradle)
        run: |
          if [ -f ./gradlew ]; then ./gradlew :${{ env.MODULE_PATH }}:assembleDebug --no-daemon; else gradle :${{ env.MODULE_PATH }}:assembleDebug --no-daemon; fi

      - name: Check for generated APK
        run: |
          APK_PATH=${{ env.MODULE_PATH }}/build/outputs/apk/debug
          echo "Looking for APK in $APK_PATH"
          ls -la $APK_PATH || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: ${{ env.MODULE_PATH }}/build/outputs/apk/debug/*.apk

