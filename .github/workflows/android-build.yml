name: Build debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    env:
      JAVA_VERSION: '17'
      ANDROID_API: '33'      # Android 14
      ANDROID_BUILD_TOOLS: '33.0.2'
      MODULE_PATH: 'app'     # <-- caminho do módulo Android (ajuste se necessário)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*','**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install Android SDK and tools
        uses:  android-actions/setup-android@v2 
        with:
          api-level:  ${{ env.ANDROID_API }}
          build-tools: ${{ env.ANDROID_BUILD_TOOLS }}

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew || true

      - name: Clean
        run: ./gradlew clean --no-daemon

      - name: Assemble debug APK
        run: ./gradlew :${{ env.MODULE_PATH }}:assembleDebug --no-daemon

      - name: Check for generated APK
        run: |
          APK_PATH=${{ env.MODULE_PATH }}/build/outputs/apk/debug
          echo "Procurando APK em $APK_PATH"
          ls -la $APK_PATH || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: ${{ env.MODULE_PATH }}/build/outputs/apk/debug/*.apk
