name: Diagnose repo and produce module path

on:
  workflow_dispatch:

jobs:
  diagnose:
    name: Repo diagnostic (find Gradle modules)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Show Git status and root files
        run: |
          echo "---- pwd ----"
          pwd
          echo "---- ls -la (root) ----"
          ls -la
          echo "---- show .gitignore (if exists) ----"
          [ -f .gitignore ] && echo '--- .gitignore ---' && sed -n '1,200p' .gitignore || echo '.gitignore not found'

      - name: Repo diagnostic - list tree and find gradle files
        run: |
          echo "---- full tree (maxdepth 3) ----"
          apt-get update -y >/dev/null
          apt-get install -y tree >/dev/null
          tree -a -L 3 || true

          echo "---- find build.gradle and build.gradle.kts files (full paths) ----"
          find . -type f \( -name "build.gradle" -o -name "build.gradle.kts" -o -name "settings.gradle" -o -name "settings.gradle.kts" \) -print || true

          echo "---- content preview for settings files (if present) ----"
          [ -f settings.gradle ] && echo '--- settings.gradle ---' && sed -n '1,120p' settings.gradle || true
          [ -f settings.gradle.kts ] && echo '--- settings.gradle.kts ---' && sed -n '1,120p' settings.gradle.kts || true

          echo "---- top-level directories list (helpful for module guess) ----"
          find . -maxdepth 2 -type d -printf '%P\n' | sed '/^$/d' || true

      - name: Save diagnostic as artifact
        uses: actions/upload-artifact@v4
        with:
          name: repo-diagnostic
          path: |
            .
        if: always()
